name: Build & Publish (GHCR)

# La imagen se construye aqui y no en el servidor: el Dockerfile hace
# `next build` y en un servidor pequeno se come toda la CPU.
#
# Rama `amigos` = upstream fijado (dca8713) + este fichero. Cada push a esa rama
# publica ghcr.io/<dueño>/openreply:sha-xxxxxxx. Sin `latest` a proposito: el
# servidor apunta siempre a una etiqueta concreta y se actualiza a mano.

on:
  push:
    branches: [amigos]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openreply
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
